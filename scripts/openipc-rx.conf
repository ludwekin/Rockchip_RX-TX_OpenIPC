# /etc/openipc-rx.conf -- OpenIPC RX configuration
# 8812AU interface in monitor mode
IFACE=wlxbcec23d80c81
# radio channel / bandwidth
CH=161
BW=HT20
# local RTP port consumed by the on-board player
RX_PORT=5600
LOCAL_PORT=5602
# forward the RTP stream to another host (0 = disabled)
FORWARD_ENABLE=0
FORWARD_IP=172.16.70.164
FORWARD_PORT=5600
